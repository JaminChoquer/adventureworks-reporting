name: Pipeline reporting

# Exécution manuelle depuis l'onglet Actions, et automatique le 2 de chaque mois à 6 h UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 2 * *'

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_LOCATION: EU
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installation des dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Chargement de la couche bronze
        run: python pipeline/load_bronze.py
